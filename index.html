<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدير الاجتماعات والمواعيد | Meetings &amp; Deadlines Manager</title>
<meta name="theme-color" content="#1F5C38">
<meta name="color-scheme" content="light dark">
<meta name="description" content="إدارة الاجتماعات والمواعيد ومحاضرها — جمعية أصدقاء السعودية">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاجتماعات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1F5C38; --green-d:#16452a; --green-l:#3f8f52; --gold:#C9A227; --orange:#E85200;
  --red:#C0392B; --blue:#2b6cb0; --slate:#5c6b63;
  --bg:#F6F4EE; --surface:#ffffff; --surface-2:#fbfaf6; --line:#e5e1d6;
  --text:#1c241f; --text-2:#5c6b63; --text-3:#8a978f;
  --input:#ffffff; --input-line:#d9d4c6;
  --shadow:0 1px 2px rgba(28,36,31,.05),0 8px 24px rgba(28,36,31,.06);
  --shadow-lg:0 24px 60px rgba(28,36,31,.18);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --side:264px;
  --sadu:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><g fill='none' stroke='%23C9A227' stroke-width='1' opacity='.35'><path d='M0 20 L10 10 L20 20 L30 10 L40 20'/><path d='M0 30 L10 40 L20 30 L30 40 L40 30'/><path d='M20 0 L20 6 M0 0 L0 6 M40 0 L40 6'/></g></svg>");
}
html[data-theme="dark"]{
  --bg:#0f1512; --surface:#161f1a; --surface-2:#1b251f; --line:#2a352e;
  --text:#eef2ef; --text-2:#a9b5ad; --text-3:#7d8b83;
  --input:#222b25; --input-line:#33403a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.6;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
/* Every inline icon gets a size by default; specific rules below override it. */
svg{width:16px;height:16px;flex:none}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ============ BOOT SPLASH ============
   Shown until we know whether a session exists, so a signed-in person
   never sees the login form flash past on refresh. */
#boot{position:fixed;inset:0;z-index:110;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 70% -10%,#2a6f45 0%,#16452a 45%,#101a14 100%);
  transition:opacity .28s ease}
#boot.out{opacity:0;pointer-events:none}
html[data-theme="light"] #boot{background:radial-gradient(1200px 700px at 70% -10%,#f2f7f3 0%,#dceae1 45%,#c8dccf 100%)}
html[data-theme="light"] #boot .p2 circle,html[data-theme="light"] #boot .p2 path{fill:#1F5C38}
.boot-in{display:grid;place-items:center;gap:20px}
.boot-in svg{width:104px;height:70px}
.boot-bar{width:132px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
html[data-theme="light"] .boot-bar{background:rgba(31,92,56,.16)}
.boot-bar i{display:block;width:40%;height:100%;border-radius:4px;background:#C9A227;animation:slide-bar 1.1s ease-in-out infinite}
@keyframes slide-bar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

/* ============ LOGIN ============ */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;
  background:radial-gradient(1200px 700px at 70% -10%,#2a6f45 0%,#16452a 45%,#101a14 100%);}
#login::after{content:"";position:absolute;inset:0;background-image:var(--sadu);opacity:.12;pointer-events:none}
.login-card{position:relative;z-index:2;width:100%;max-width:400px;background:rgba(18,28,22,.72);
  border:1px solid rgba(201,162,39,.28);border-radius:22px;padding:30px 26px 26px;backdrop-filter:blur(14px);
  box-shadow:var(--shadow-lg);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.logo{display:grid;place-items:center;margin-bottom:14px}
.logo svg{width:88px;height:60px}
.logo .p1{animation:bob 2.6s ease-in-out infinite}
.logo .p2{animation:bob 2.6s ease-in-out .35s infinite}
.logo .p3{animation:bob 2.6s ease-in-out .7s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.login-card h1{margin:0;text-align:center;font-size:20px;font-weight:800;color:#fff;letter-spacing:.2px}
.login-card p.sub{margin:6px 0 20px;text-align:center;color:#a8bdb0;font-size:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#a8bdb0;margin-bottom:6px}
.field input,.field select{width:100%;background:#222b25;border:1px solid #33403a;color:#eef2ef;
  border-radius:11px;padding:12px 13px;transition:border-color .18s,box-shadow .18s}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18);outline:none}
.btn-gold{width:100%;background:linear-gradient(135deg,#d9b336,#b8901d);color:#1b1405;border:0;
  border-radius:11px;padding:13px;font-weight:800;letter-spacing:.3px;transition:transform .15s,filter .15s}
.btn-gold:hover{filter:brightness(1.06)} .btn-gold:active{transform:translateY(1px)}
.lg-link{display:block;width:100%;margin-top:10px;background:none;border:0;color:#C9A227;font-size:12.5px;
  font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px}
.lg-link:hover{color:#e0c25a}
html[data-theme="light"] .lg-link{color:#8a6d10}
.lg-tools{display:flex;gap:7px;justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
html[dir="rtl"] .lg-tools{flex-direction:row-reverse}
html[data-theme="light"] .lg-tools{border-top-color:rgba(31,92,56,.14)}
.lg-tool{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#cfe0d6;border-radius:10px;
  padding:6px 11px;font-size:12.5px;font-weight:800;display:grid;place-items:center;transition:background .16s,color .16s,border-color .16s}
.lg-tool:hover{background:rgba(201,162,39,.16);border-color:rgba(201,162,39,.45);color:#fff}
.lg-tool svg{width:15px;height:15px}
.lg-tool{min-width:44px;height:32px}
#lg-hint{display:block;margin-top:5px}

/* Sign-in screen follows the chosen theme, so the toggle is honest. */
html[data-theme="light"] #login{background:radial-gradient(1200px 700px at 70% -10%,#f2f7f3 0%,#dceae1 45%,#c8dccf 100%)}
html[data-theme="light"] #login::after{opacity:.22}
html[data-theme="light"] .login-card{background:rgba(255,255,255,.9);border-color:rgba(31,92,56,.18);
  box-shadow:0 24px 60px rgba(28,36,31,.16)}
html[data-theme="light"] .login-card h1{color:#1F5C38}
html[data-theme="light"] .login-card p.sub{color:#5c6b63}
html[data-theme="light"] .field label{color:#5c6b63}
html[data-theme="light"] .field input{background:#fff;border-color:#d9d4c6;color:#1c241f}
html[data-theme="light"] .field input:focus{border-color:#C9A227}
html[data-theme="light"] .login-foot{color:#7c8a82}
html[data-theme="light"] .lg-tool{background:rgba(31,92,56,.07);border-color:rgba(31,92,56,.2);color:#3f6b51}
html[data-theme="light"] .lg-tool:hover{background:rgba(201,162,39,.16);border-color:rgba(201,162,39,.5);color:#1F5C38}
html[data-theme="light"] .logo .p2 circle,html[data-theme="light"] .logo .p2 path{fill:#1F5C38}
.login-foot{margin-top:16px;text-align:center;font-size:11.5px;color:#7d8b83;line-height:1.8}
.login-foot b{color:#c9a227;font-weight:700}

/* ============ SHELL ============ */
#app{display:none;min-height:100vh}
#app.on{display:block}
.side{position:fixed;inset-block:0;inset-inline-start:0;width:var(--side);z-index:40;
  background:linear-gradient(180deg,#1F5C38 0%,#16452a 100%);color:#dfe9e2;display:flex;flex-direction:column;
  border-inline-end:1px solid rgba(201,162,39,.2)}
.side::before{content:"";position:absolute;inset:0;background-image:var(--sadu);opacity:.07;pointer-events:none}
.side-top{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;position:relative}
.side-top .mark{width:38px;height:38px;border-radius:11px;background:rgba(201,162,39,.15);border:1px solid rgba(201,162,39,.35);
  display:grid;place-items:center;flex:none}
.side-top .mark svg{width:22px;height:22px}
.side-top h2{margin:0;font-size:14.5px;font-weight:800;color:#fff;line-height:1.25}
.side-top span{font-size:11px;color:#9fb8a8}
.nav{flex:1;overflow-y:auto;padding:6px 10px 10px;position:relative}
.nav-lbl{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#7fa38d;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;text-decoration:none;
  color:#cfe0d6;font-size:14px;font-weight:600;margin-bottom:2px;position:relative;transition:background .16s,color .16s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a{position:relative;z-index:1}
.nav a.on{background:transparent;color:#fff}
/* One pill slides between items instead of each item lighting up. */
.nav-pill{position:absolute;inset-inline:10px;top:0;height:0;border-radius:11px;background:rgba(201,162,39,.16);
  z-index:0;opacity:0;pointer-events:none;
  transition:transform .36s cubic-bezier(.2,.8,.2,1),height .28s ease,opacity .2s ease}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-10px;top:50%;transform:translateY(-50%);
  width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--gold)}
html[dir="rtl"] .nav a.on::before{border-radius:4px 0 0 4px}
.nav a .cnt{margin-inline-start:auto;background:rgba(255,255,255,.12);border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
.nav a .cnt.warn{background:var(--orange);color:#fff}
.side-bot{padding:12px;border-top:1px solid rgba(255,255,255,.1);position:relative}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.me .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#a9821a);color:#231a03;
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.me .nm{font-size:13px;font-weight:700;color:#fff;line-height:1.25}
.me .rl{font-size:11px;color:#9fb8a8}
.me button{margin-inline-start:auto;background:transparent;border:0;color:#9fb8a8;padding:6px;border-radius:8px}
.me button:hover{background:rgba(255,255,255,.1);color:#fff}

.main{margin-inline-start:var(--side);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px}
.burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;background:var(--input);border:1px solid var(--input-line);border-radius:12px;
  padding:10px 40px 10px 14px;transition:border-color .18s,box-shadow .18s}
html[dir="rtl"] .search input{padding:10px 40px 10px 14px}
html[dir="ltr"] .search input{padding:10px 14px 10px 40px}
.search input:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(63,143,82,.15);outline:none}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-3);pointer-events:none}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:7px}
html[dir="rtl"] .tb-actions{flex-direction:row-reverse}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px;display:grid;place-items:center;
  color:var(--text-2);position:relative;transition:background .16s,color .16s,border-color .16s}
.icon-btn:hover{color:var(--text);border-color:var(--green-l)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:5px;inset-inline-end:5px;min-width:16px;height:16px;border-radius:9px;background:var(--orange);
  color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.lang-btn{font-weight:800;font-size:12.5px;padding:9px 12px;min-width:44px}
.page{padding:22px;max-width:1400px;width:100%;flex:1}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.2px}
.page-head p{margin:3px 0 0;color:var(--text-2);font-size:13.5px}
.page-head .right{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:11px;padding:9px 14px;
  font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.16s}
.btn:hover{border-color:var(--green-l)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-l);border-color:var(--green-l)}
.btn.gold{background:linear-gradient(135deg,#d9b336,#b8901d);border:0;color:#1b1405}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:#e0b6b1;color:var(--red)}
.btn.danger:hover{background:rgba(192,57,43,.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;inset-block-end:22px;inset-inline-end:22px;z-index:35;border:0;border-radius:50%;width:56px;height:56px;
  background:linear-gradient(135deg,#d9b336,#b8901d);color:#1b1405;box-shadow:0 10px 26px rgba(184,144,29,.42);
  display:grid;place-items:center;transition:transform .18s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:24px;height:24px}

/* ============ VIEW TRANSITIONS ============
   Runs only when the view actually changes, never on a data refresh,
   so live updates don't make the page jump about. */
.page.enter > *{animation:view-rise .42s cubic-bezier(.2,.8,.2,1) both}
.page.enter > *:nth-child(1){animation-delay:0ms}
.page.enter > *:nth-child(2){animation-delay:55ms}
.page.enter > *:nth-child(3){animation-delay:105ms}
.page.enter > *:nth-child(4){animation-delay:150ms}
.page.enter > *:nth-child(n+5){animation-delay:190ms}
@keyframes view-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Cards inside a panel cascade in behind their header. */
.page.enter .panel-b > .row{animation:row-in .34s ease both}
.page.enter .panel-b > .row:nth-child(1){animation-delay:120ms}
.page.enter .panel-b > .row:nth-child(2){animation-delay:160ms}
.page.enter .panel-b > .row:nth-child(3){animation-delay:200ms}
.page.enter .panel-b > .row:nth-child(n+4){animation-delay:235ms}
@keyframes row-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* Mobile tab bar: the active icon lifts rather than just recolouring. */
.tabbar a{transition:color .2s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.tabbar a.on{transform:translateY(-2px)}
.tabbar a svg{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.tabbar a.on svg{transform:scale(1.12)}

/* ============ CARDS / GRID ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:16px}
.stat{padding:15px 16px;position:relative;overflow:hidden}
.stat .k{font-size:12px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:6px}
.stat .v{font-size:29px;font-weight:800;line-height:1.15;margin-top:5px;letter-spacing:-1px}
.stat .m{font-size:11.5px;color:var(--text-3);margin-top:2px}
.stat .bar{position:absolute;inset-block-start:0;inset-inline-start:0;width:4px;height:100%;background:var(--green)}
.stat.warn .bar{background:var(--orange)} .stat.warn .v{color:var(--orange)}
.stat.bad .bar{background:var(--red)} .stat.bad .v{color:var(--red)}
.stat.gold .bar{background:var(--gold)}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.panel{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:15px;font-weight:800}
.panel-h > svg{width:17px;height:17px;color:var(--text-2)}
.panel-h .chip-sm{margin-inline-start:auto}
.panel-b{padding:6px 8px 10px}
.empty{text-align:center;padding:34px 20px;color:var(--text-2)}
.empty svg{width:38px;height:38px;color:var(--text-3);margin-bottom:10px}
.empty h4{margin:0 0 5px;font-size:14.5px;color:var(--text);font-weight:700}
.empty p{margin:0 0 14px;font-size:13px}

/* ============ ROWS ============ */
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;text-align:start;width:100%;
  background:transparent;border:0;border-inline-start:3px solid transparent;transition:background .15s}
.row:hover{background:var(--surface-2)}
.row .when{flex:none;width:60px;text-align:center;padding-top:2px}
.row .when .d{font-size:17px;font-weight:800;line-height:1}
.row .when .m{font-size:10.5px;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.row .body{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14px;line-height:1.35;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.row .meta span{display:inline-flex;align-items:center;gap:4px}
.row .meta svg{width:12px;height:12px;opacity:.7}
.row.od{border-inline-start-color:var(--red);background:rgba(192,57,43,.045)}
.row.soon{border-inline-start-color:var(--orange)}

/* ============ CHIPS ============ */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;
  border:1px solid transparent;white-space:nowrap}
.chip .glyph{font-size:10px;line-height:1}
.chip-sm{font-size:11px;padding:1px 8px}
.c-slate{background:rgba(92,107,99,.12);color:var(--text-2);border-color:rgba(92,107,99,.25)}
.c-blue{background:rgba(43,108,176,.12);color:#2b6cb0;border-color:rgba(43,108,176,.3)}
.c-green{background:rgba(31,92,56,.12);color:var(--green);border-color:rgba(31,92,56,.28)}
.c-gold{background:rgba(201,162,39,.16);color:#8a6d10;border-color:rgba(201,162,39,.4)}
.c-orange{background:rgba(232,82,0,.12);color:var(--orange);border-color:rgba(232,82,0,.3)}
.c-red{background:rgba(192,57,43,.12);color:var(--red);border-color:rgba(192,57,43,.3)}
html[data-theme="dark"] .c-green{color:#7fc394} html[data-theme="dark"] .c-gold{color:#e0c25a}
html[data-theme="dark"] .c-blue{color:#7fb0e0} html[data-theme="dark"] .c-red{color:#e78d83}
html[data-theme="dark"] .c-orange{color:#ff9155}

/* ============ FILTER BAR ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sel{background:var(--input);border:1px solid var(--input-line);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600}
.sel:focus{border-color:var(--green-l);outline:none;box-shadow:0 0 0 3px rgba(63,143,82,.14)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;border-radius:8px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--green);box-shadow:var(--shadow)}
html[data-theme="dark"] .seg button.on{color:#7fc394}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th button{background:none;border:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;display:inline-flex;gap:4px;align-items:center}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .14s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.od td:first-child{box-shadow:inset 3px 0 0 var(--red)}
html[dir="rtl"] tbody tr.od td:first-child{box-shadow:inset -3px 0 0 var(--red)}
td .ttl{font-weight:700}
td .sub{font-size:11.5px;color:var(--text-3)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:64px}
.prog i{display:block;height:100%;background:var(--green);border-radius:6px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3f8f52,#1F5C38);color:#fff;
  display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;flex:none}
.who{display:flex;align-items:center;gap:7px;white-space:nowrap}

/* ============ CALENDAR ============ */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h3{margin:0;font-size:17px;font-weight:800;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dow{background:var(--surface-2);padding:9px 6px;text-align:center;font-size:11.5px;font-weight:800;color:var(--text-2)}
.cal .day{background:var(--surface);min-height:104px;padding:6px;position:relative}
.cal .day.out{background:var(--surface-2);opacity:.55}
.cal .day .n{font-size:12px;font-weight:700;color:var(--text-2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .n{background:var(--green);color:#fff}
.cal .ev{display:block;width:100%;text-align:start;border:0;background:rgba(31,92,56,.1);color:var(--green);border-inline-start:3px solid var(--green);
  border-radius:5px;padding:3px 6px;margin-top:3px;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-theme="dark"] .cal .ev{color:#8fd0a4}
.cal .ev.dl{background:rgba(232,82,0,.1);color:var(--orange);border-inline-start-color:var(--orange)}
.cal .ev.done{opacity:.55;text-decoration:line-through}
.cal .ev.canc{opacity:.45;text-decoration:line-through}

/* ============ BOARD ============ */
.board{display:grid;grid-template-columns:repeat(6,minmax(212px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:180px}
.col.over{border-color:var(--gold);background:rgba(201,162,39,.07)}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.col h4 .n{margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 7px;font-size:11px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;
  box-shadow:var(--shadow);cursor:grab;text-align:start;width:100%;display:block}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard .t{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:6px}
.kcard .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(12,20,15,.5);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);z-index:51;background:var(--bg);
  border-inline-start:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none !important}
.dr-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--surface)}
.dr-h h2{margin:0;font-size:18px;font-weight:800;line-height:1.3}
.dr-h .sub{font-size:12.5px;color:var(--text-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-h .x{margin-inline-start:auto;flex:none}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px 90px}
.dr-f{position:absolute;inset-block-end:0;inset-inline:0;padding:12px 18px;border-top:1px solid var(--line);
  background:var(--surface);display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-bottom:20px}
.sec h4{margin:0 0 9px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-2);
  display:flex;align-items:center;gap:7px}
.sec h4::after{content:"";flex:1;height:1px;background:var(--line)}
.sec h4 > svg{width:14px;height:14px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:13.5px}
.kv dt{color:var(--text-2);font-weight:600}
.kv dd{margin:0;font-weight:600}
.agenda{list-style:none;margin:0;padding:0;counter-reset:ag}
.agenda li{counter-increment:ag;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;position:relative;padding-inline-start:40px}
.agenda li::before{content:counter(ag);position:absolute;inset-inline-start:11px;top:10px;width:20px;height:20px;border-radius:6px;
  background:rgba(201,162,39,.18);color:#8a6d10;font-size:11px;font-weight:800;display:grid;place-items:center}
html[data-theme="dark"] .agenda li::before{color:#e0c25a}
.agenda li .tp{font-weight:700;font-size:13.5px}
.agenda li .nt{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:pre-wrap}
.note{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:13.5px;white-space:pre-wrap}
.people{display:flex;flex-wrap:wrap;gap:7px}
.person{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 11px 4px 4px;font-size:12.5px;font-weight:600}
html[dir="rtl"] .person{padding:4px 4px 4px 11px}
.tl{position:relative;padding-inline-start:20px}
.tl::before{content:"";position:absolute;inset-inline-start:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:13px}
.tl-i::before{content:"";position:absolute;inset-inline-start:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
.tl-i .a{font-size:13px;font-weight:700}
.tl-i .d{font-size:12px;color:var(--text-2)}
.tl-i .t{font-size:11px;color:var(--text-3);margin-top:1px}

/* ============ MODAL / FORM ============ */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);width:min(680px,100%);
  box-shadow:var(--shadow-lg);max-height:92vh;display:flex;flex-direction:column;animation:pop .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.mbox header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0}
.mbox header h3{margin:0;font-size:16.5px;font-weight:800}
.mbox .mb{padding:16px 18px;overflow-y:auto;flex:1}
.mbox footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{margin-bottom:12px}
.fg.full{grid-column:1/-1}
.fg label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.fg label .req{color:var(--orange)}
.fg input,.fg select,.fg textarea{width:100%;background:var(--input);border:1px solid var(--input-line);border-radius:11px;padding:10px 12px;transition:border-color .16s,box-shadow .16s}
.fg textarea{resize:vertical;min-height:74px;line-height:1.6}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--green-l);box-shadow:0 0 0 3px rgba(63,143,82,.15);outline:none}
.fg .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}
.err{color:var(--red);font-size:12.5px;font-weight:700;margin-top:5px;display:flex;gap:5px;align-items:center}
.rep-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.rep-row .h{flex:none;width:26px;height:38px;display:grid;place-items:center;color:var(--text-3);font-weight:800;font-size:12px}
.rep-row input,.rep-row select{flex:1}
.rep-row .del{flex:none;background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--text-3)}
.rep-row .del:hover{color:var(--red);border-color:#e0b6b1}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.check{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.check input{width:15px;height:15px;accent-color:var(--green);margin:0}
.check.on{background:rgba(31,92,56,.1);border-color:var(--green)}

/* ============ NOTIFICATIONS / TOAST ============ */
.pop{position:fixed;inset-block-start:62px;inset-inline-end:18px;z-index:55;width:min(370px,calc(100vw - 24px));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:pop .2s ease both}
.pop h4{margin:0;padding:13px 15px;font-size:14px;font-weight:800;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pop h4 button{margin-inline-start:auto;background:none;border:0;font-size:12px;font-weight:700;color:var(--green);padding:0}
.pop h4 > svg{width:16px;height:16px;color:var(--text-2)}
.pop .list{max-height:min(430px,60vh);overflow-y:auto}
.nrow{display:flex;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;background:transparent;border-inline:0;border-top:0;text-align:start}
.nrow:hover{background:var(--surface-2)}
.nrow.un{background:rgba(201,162,39,.06)}
.nrow .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.nrow .ic svg{width:15px;height:15px}
.nrow .t{font-size:13px;font-weight:700;line-height:1.35}
.nrow .d{font-size:12px;color:var(--text-2);margin-top:2px}
.nrow .w{font-size:11px;color:var(--text-3);margin-top:3px}
#toasts{position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--green);border-radius:12px;
  padding:11px 15px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;max-width:340px;animation:slide .28s cubic-bezier(.2,.8,.2,1) both}
.toast.bad{border-inline-start-color:var(--red)}
.toast.warn{border-inline-start-color:var(--orange)}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ MOBILE ============ */
.tabbar{display:none;position:fixed;inset-block-end:0;inset-inline:0;z-index:38;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--text-3);
  font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px}
.tabbar a svg{width:20px;height:20px}
.tabbar a.on{color:var(--green)}
html[data-theme="dark"] .tabbar a.on{color:#7fc394}
@media (max-width:1080px){.cols{grid-template-columns:1fr}}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .28s}
  html[dir="rtl"] .side{transform:translateX(100%)}
  .side.on{transform:none !important}
  .main{margin-inline-start:0}
  .burger{display:grid}
  .tabbar{display:flex}
  .page{padding:16px 14px 84px}
  .fab{inset-block-end:78px}
  .board{grid-template-columns:repeat(6,minmax(190px,1fr))}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:100px 1fr}
  .page-head h1{font-size:20px}
  .stat .v{font-size:25px}
}

/* ============ WEEK VIEW ============ */
.week{display:grid;grid-template-columns:56px repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.week .wh{background:var(--surface-2);padding:8px 4px;text-align:center;font-size:11.5px;font-weight:800;color:var(--text-2);border-bottom:1px solid var(--line)}
.week .wh.today{color:var(--green);background:rgba(31,92,56,.1)}
html[data-theme="dark"] .week .wh.today{color:#7fc394}
.week .wh small{display:block;font-size:15px;font-weight:800;color:var(--text)}
.week .gut{border-inline-end:1px solid var(--line);background:var(--surface-2)}
.week .hr{height:46px;border-bottom:1px dashed var(--line);font-size:10.5px;color:var(--text-3);padding:2px 5px;text-align:end}
.wcol{position:relative;border-inline-end:1px solid var(--line)}
.wcol .slot{height:46px;border-bottom:1px dashed var(--line)}
.wev{position:absolute;inset-inline:3px;border-radius:8px;padding:3px 6px;font-size:11px;font-weight:700;overflow:hidden;
  background:rgba(31,92,56,.14);color:var(--green);border-inline-start:3px solid var(--green);text-align:start;cursor:pointer}
html[data-theme="dark"] .wev{color:#8fd0a4}
.wev.k-external{background:rgba(232,82,0,.13);color:var(--orange);border-inline-start-color:var(--orange)}
.wev.k-online{background:rgba(43,108,176,.13);color:#2b6cb0;border-inline-start-color:#2b6cb0}
.wev.k-visit{background:rgba(201,162,39,.16);color:#8a6d10;border-inline-start-color:var(--gold)}
html[data-theme="dark"] .wev.k-online{color:#7fb0e0} html[data-theme="dark"] .wev.k-visit{color:#e0c25a}
.wev.canc{opacity:.45;text-decoration:line-through}
.wev small{display:block;font-weight:600;opacity:.85}

/* ============ CONFLICT + CALLOUTS ============ */
.callout{display:flex;gap:9px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.6}
.callout svg{width:16px;height:16px;flex:none;margin-top:2px}
.callout.warn{background:rgba(232,82,0,.1);border:1px solid rgba(232,82,0,.3);color:var(--orange)}
.callout.info{background:rgba(43,108,176,.09);border:1px solid rgba(43,108,176,.25);color:#2b6cb0}
html[data-theme="dark"] .callout.info{color:#7fb0e0}
.fu{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:7px}
.fu .bx{width:16px;height:16px;border:2px solid var(--text-3);border-radius:4px;flex:none;margin-top:2px}
.fu .tx{flex:1;font-size:13.5px;font-weight:600}
.fu .mt{font-size:11.5px;color:var(--text-2);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.fu .mt svg{width:12px;height:12px;opacity:.7}

/* ============ INSTALLED (standalone) ============ */
@media (display-mode: standalone){
  .topbar{padding-top:calc(12px + env(safe-area-inset-top))}
  .side-top{padding-top:calc(18px + env(safe-area-inset-top))}
  #login{padding-top:calc(22px + env(safe-area-inset-top))}
  .drawer{padding-top:env(safe-area-inset-top)}
}
.live-pill{display:none;align-items:center;gap:7px;background:rgba(31,92,56,.1);border:1px solid rgba(31,92,56,.28);
  color:var(--green);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.live-pill.on{display:inline-flex}
html[data-theme="dark"] .live-pill{color:#7fc394;background:rgba(63,143,82,.14);border-color:rgba(63,143,82,.35)}
.live-pill i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@media (max-width:640px){.live-pill span{display:none}.live-pill{padding:7px}}
.net-pill{display:none;align-items:center;gap:6px;background:rgba(232,82,0,.12);border:1px solid rgba(232,82,0,.35);
  color:var(--orange);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.net-pill.on{display:inline-flex}
.net-pill svg{width:13px;height:13px}
@media (max-width:640px){.net-pill span{display:none}}

@media print{.side,.topbar,.fab,.tabbar,.dr-f{display:none}.main{margin:0}}
</style>
</head>

    </div>

    </div>

  </div>

<!-- ================= APP ================= -->
<div id="app">

const MS_DAY = 86400000;

function dayAt(offset,h=9,m=0){ const d=new Date(); d.setDate(d.getDate()+offset); d.setHours(h,m,0,0); return d.toISOString(); }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){ const x=startOfDay(d); x.setDate(x.getDate()-x.getDay()); return x; }   // week starts Sunday
function sameDay(a,b){ a=new Date(a);b=new Date(b); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function daysBetween(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/MS_DAY); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* Dates always display dd/mm/yy — SFC standard */
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)}`; }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0');
  let h=d.getHours(); const am=h>=12; h=h%12||12; return `${p(h)}:${p(d.getMinutes())} ${am?t('pm'):t('am')}`; }
function fmtDT(iso){ return iso ? fmtDate(iso)+' · '+fmtTime(iso) : '—'; }
function fmtRange(m){ return fmtTime(m.start_at) + (m.end_at?' – '+fmtTime(m.end_at):''); }
function duration(m){ if(!m.end_at) return ''; const mins=Math.round((new Date(m.end_at)-new Date(m.start_at))/60000);
  const h=Math.floor(mins/60), mm=mins%60; return (h?h+t('hShort'):'')+(mm?' '+mm+t('mShort'):''); }
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fromLocalInput(v){ return v ? new Date(v).toISOString() : null; }
function relative(iso){ if(!iso) return '';
  const n = daysBetween(new Date(), iso);
  if(n===0) return t('today'); if(n===1) return t('tomorrow'); if(n===-1) return t('yesterday');
  return n>0 ? t('inDays').replace('{n}',n) : t('agoDays').replace('{n}',Math.abs(n)); }
function initials(name){ return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function monthName(y,mo){ return new Date(y,mo,1).toLocaleDateString(LANG==='ar'?'ar-SA-u-nu-latn':'en-GB',{month:'long',year:'numeric'}); }
function shortMonth(iso){ return new Date(iso).toLocaleDateString(LANG==='ar'?'ar-SA-u-nu-latn':'en-GB',{month:'short'}); }

const needsMinutes = m => isPast(m) && !['cancelled','postponed'].includes(m.status) && !(m.notes||'').trim() && !(m.decisions||'').trim();

/* ---------- 7. Conflict detection ---------- */
function overlaps(aStart,aEnd,bStart,bEnd){
  const s1=new Date(aStart), e1=new Date(aEnd||aStart), s2=new Date(bStart), e2=new Date(bEnd||bStart);
  return s1 < e2 && s2 < e1;
}
function findConflicts(draft, ignoreId){
  const out=[];
  DB.meetings.forEach(m=>{
    if(m.id===ignoreId || ['cancelled','postponed'].includes(m.status)) return;
    if(!overlaps(draft.start_at,draft.end_at,m.start_at,m.end_at)) return;
    if(draft.room && m.room===draft.room && draft.room!=='خارج المقر') out.push({type:'room',meeting:m});
    const shared = (draft.attendees||[]).filter(u=>isAttendee(m.id,u));
    shared.forEach(u=>out.push({type:'person',meeting:m,user_id:u}));
  });
  return out;
}
function conflictCount(){
  const seen=new Set(); let n=0;
  DB.meetings.filter(m=>m.status==='scheduled' && !isPast(m)).forEach(m=>{
    const c=findConflicts({start_at:m.start_at,end_at:m.end_at,room:m.room,attendees:attendeesOf(m.id).map(a=>a.user_id)}, m.id);
    c.forEach(x=>{ const key=[m.id,x.meeting.id].sort().join('|')+x.type; if(!seen.has(key)){seen.add(key);n++;} });
  });
  return n;
}

/* ---------- 9. Store (demo / Supabase write-through) ---------- */
const Store = {
  /* Load supabase-js from the CDN, but never let a slow or blocked
     network hang the whole app on a blank screen — give up after 6s
     and run offline instead. */
  /* Try more than one CDN: one of them being blocked shouldn't take the
     whole app down. Give up after 6s per source rather than hanging. */
  CDNS:['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
        'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'],
  loadOne(src){
    return new Promise(res=>{
      let done=false;
      const finish=v=>{ if(!done){ done=true; clearTimeout(timer); res(v); } };
      const timer=setTimeout(()=>finish(false),6000);
      const el=document.createElement('script');
      el.src=src; el.onload=()=>finish(!!window.supabase); el.onerror=()=>finish(false);
      document.head.appendChild(el);
    });
  },
  /* Race the sources rather than trying them in turn: waiting 6s per CDN
     would mean 12s of blank screen before giving up. */
  async loadLib(){
    if(window.supabase) return true;
    const ok = await Promise.race([
      ...this.CDNS.map(src=>this.loadOne(src).then(v=>v?true:new Promise(()=>{}))),
      new Promise(r=>setTimeout(()=>r(false),6500))
    ]);
    if(!ok) S.errDetail='CDN blocked or offline';
    return !!ok;
  },
  /* Live mode creates the client only. Rows are read after sign-in,
     because row-level security gives an anonymous caller nothing. */
  async init(){
    const c = CONN.get();
    S.conn = c;
    if(c.url && c.key){
      if(await this.loadLib()){
        try{
          S.sb = window.supabase.createClient(c.url, c.key,
            { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false } });
          S.mode='live';
          return;
        }catch(e){ S.errDetail=e.message; console.warn('Could not create the Supabase client:', e.message); }
      }
      S.mode='error';      // configured but unreachable — never invent data
      return;
    }
    S.mode='demo';
    if(!Local.load()){ seed(); Local.save(); }
  },
  async loadAll(){
    for(const tb of TABLES){
      const {data,error}=await S.sb.from(tb).select('*');
      if(error) throw error;
      DB[tb]=data||[];
    }
  },
  insert(tbl,row){ row.id=row.id||uid(); row.created_at=nowISO(); row.updated_at=nowISO(); DB[tbl].push(row);
    if(S.mode==='live'){ RT.mark(tbl,row.id); S.sb.from(tbl).insert(row).then(({error})=>error&&toast(error.message,'bad')); }
    else Local.save(); return row; },
  update(tbl,id,patch){ const r=byId(tbl,id); if(!r) return null; Object.assign(r,patch,{updated_at:nowISO()});
    if(S.mode==='live'){ RT.mark(tbl,id); S.sb.from(tbl).update({...patch,updated_at:r.updated_at}).eq('id',id).then(({error})=>error&&toast(error.message,'bad')); }
    else Local.save(); return r; },
  remove(tbl,id){ DB[tbl]=DB[tbl].filter(r=>r.id!==id);
    if(S.mode==='live'){ RT.mark(tbl,id); S.sb.from(tbl).delete().eq('id',id).then(({error})=>error&&toast(error.message,'bad')); }
    else Local.save(); }
};

/* ---------- 9b. Local persistence (offline / demo mode) ----------
   An installed app that forgets everything on reload is useless, so demo
   mode writes through to localStorage. Wrapped throughout: private-mode
   and sandboxed frames throw on access, and that must not break the app. */
const Local = {
  KEY:'sfc-meetings-db-v1',
  available(){ try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } },
  save(){
    if(!this.available()) return false;
    clearTimeout(this._tm);
    this._tm=setTimeout(()=>{ try{ localStorage.setItem(this.KEY, JSON.stringify({v:1,at:nowISO(),db:DB})); }
      catch(e){ console.warn('Could not save locally:', e.message); } },250);
    return true;
  },
  load(){
    if(!this.available()) return false;
    try{
      const raw=localStorage.getItem(this.KEY); if(!raw) return false;
      const parsed=JSON.parse(raw);
      if(!parsed || parsed.v!==1 || !parsed.db || !Array.isArray(parsed.db.users) || !parsed.db.users.length) return false;
      TABLES.forEach(tb=>{ DB[tb] = Array.isArray(parsed.db[tb]) ? parsed.db[tb] : []; });
      return true;
    }catch(e){ console.warn('Stored data unreadable, starting fresh:', e.message); return false; }
  },
  /* Write immediately. Phones kill backgrounded apps, so a debounced
     write that is still pending when the app is dismissed would be lost. */
  flush(){
    clearTimeout(this._tm);
    if(!this.available()) return false;
    try{ localStorage.setItem(this.KEY, JSON.stringify({v:1,at:nowISO(),db:DB})); return true; }
    catch(e){ console.warn('Could not save locally:', e.message); return false; }
  },
  clear(){ clearTimeout(this._tm); try{ localStorage.removeItem(this.KEY); }catch(e){} }
};
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && S.mode==='demo') Local.flush(); });
window.addEventListener('pagehide',()=>{ if(S.mode==='demo') Local.flush(); });

/* ---------- 9c. Realtime -------------------------------------------
   Changes made on one device appear on the others without a reload.
   Four things this has to get right:
     - patch the local tables surgically, never refetch the world
     - batch a burst of events into one repaint
     - ignore the echo of our own writes
     - never repaint while someone is typing into a form            */
const RT = {
  ch:null, timer:null, dirty:false, echo:new Map(),

  start(){
    if(S.mode!=='live' || !S.sb) return;
    this.stop();
    this.ch = S.sb.channel('sfc-meetings-'+Math.random().toString(36).slice(2,8));
    TABLES.forEach(tb=>{
      this.ch.on('postgres_changes',{event:'*',schema:'public',table:tb},p=>this.onChange(tb,p));
    });
    this.ch.subscribe(status=>{
      S.rtOn = (status==='SUBSCRIBED');
      updateLivePill();
      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT') setTimeout(()=>this.start(),4000);
    });
  },
  stop(){ try{ if(this.ch) S.sb.removeChannel(this.ch); }catch(e){} this.ch=null; S.rtOn=false; },

  /* Remember our own writes briefly so their echo doesn't repaint the UI. */
  mark(tbl,id){ const k=tbl+':'+id; this.echo.set(k,Date.now()); setTimeout(()=>this.echo.delete(k),4000); },
  isEcho(tbl,id){ return this.echo.has(tbl+':'+id); },

  onChange(tbl,p){
    const row = (p.eventType==='DELETE') ? p.old : p.new;
    if(!row || !row.id) return;
    const mine = this.isEcho(tbl,row.id);

    if(p.eventType==='INSERT'){
      if(!byId(tbl,row.id)) DB[tbl].push(row);
    } else if(p.eventType==='UPDATE'){
      const r=byId(tbl,row.id);
      if(r) Object.assign(r,row); else DB[tbl].push(row);
    } else {
      DB[tbl]=DB[tbl].filter(x=>x.id!==row.id);
    }
    if(!mine) this.queue();      // our own edits are already on screen
  },

  queue(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),250); },

  flush(){
    if(!S.user) return;
    /* Mid-edit guard: a half-typed form must not be torn down under
       the user. Hold the repaint until the dialog closes. */
    if(document.getElementById('modal-host').innerHTML){ this.dirty=true; return; }
    this.dirty=false;
    render();
    if(S.openMeetingId){
      if(byId('meetings',S.openMeetingId)) reopenMeetingQuietly(S.openMeetingId);
      else { closeDrawer(); S.openMeetingId=null; toast(t('deletedElsewhere'),'warn'); }
    }
  },

  /* Events can be missed while a phone is asleep, so re-read on return. */
  async resync(){
    if(S.mode!=='live'||!S.sb) return;
    try{
      for(const tb of TABLES){
        const {data,error}=await S.sb.from(tb).select('*');
        if(!error && data) DB[tb]=data;
      }
      if(S.user) this.flush();
    }catch(e){ console.warn('Resync failed:', e.message); }
  }
};

function filterMeetings(f){
  let rows=DB.meetings.slice();
  if(f.kind) rows=rows.filter(m=>m.kind===f.kind);
  if(f.status) rows=rows.filter(m=>m.status===f.status);
  if(f.program) rows=rows.filter(m=>m.program_id===f.program);
  if(f.room) rows=rows.filter(m=>m.room===f.room);
  if(f.attendee) rows=rows.filter(m=>isAttendee(m.id,f.attendee));
  if(f.range){ const n=Number(f.range), now=new Date();
    rows=rows.filter(m=>{ const d=daysBetween(now,m.start_at); return n>0?(d>=0&&d<=n):(d<0); }); }
  rows.sort((a,b)=>{
    if(f.sort==='title') return String(a.title).localeCompare(String(b.title));
    if(f.sort==='updated') return new Date(b.updated_at||0)-new Date(a.updated_at||0);
    return new Date(a.start_at)-new Date(b.start_at);
  });
  return rows;
}

      if(top<-40) return '';
      return `<button class="wev k-${m.kind} ${m.status==='cancelled'?'canc':''}" style="top:${Math.max(0,top)}px;height:${h}px"
        data-act="open-meeting" data-id="${m.id}" title="${esc(m.title)}">${esc(m.title)}<small>${esc(fmtTime(m.start_at))}</small></button>`;
    }).join('');
    return `<div class="wcol">${hours.map(()=>`<div class="slot"></div>`).join('')}${evs}</div>`;
  }).join('');
  const heads=days.map(d=>`<div class="wh ${sameDay(d,new Date())?'today':''}">${esc(dowNames()[d.getDay()])}<small>${String(d.getDate()).padStart(2,'0')}</small></div>`).join('');
  return calNavBar(label) + `<div class="week"><div class="wh"></div>${heads}${gutter}${cols}</div>`;
}

function viewSearch(){
  const q=S.query.trim().toLowerCase(), hit=s=>String(s||'').toLowerCase().includes(q);
  const ms=DB.meetings.filter(m=>hit(m.title)||hit(m.description)||hit(m.notes)||hit(m.decisions)||hit(m.guests)||hit(m.room)
    ||agendaOf(m.id).some(a=>hit(a.topic)||hit(a.notes))||followUpsOf(m.id).some(f=>hit(f.text)));
  const ps=DB.programs.filter(p=>hit(p.name)||hit(p.name_en)||hit(p.client_name)||hit(p.description));
  if(!ms.length&&!ps.length) return `<div class="page-head"><div><h1>${esc(t('searchResults').replace('{q}',S.query))}</h1></div></div>
    <div class="card">${emptyState('emptySearch','emptySearchMsg')}</div>`;
  return `<div class="page-head"><div><h1>${esc(t('searchResults').replace('{q}',S.query))}</h1>
    <p>${ms.length+ps.length} ${esc(t('results'))}</p></div></div>
    ${ms.length?`<section class="card panel" style="margin-bottom:16px"><div class="panel-h">${svg(I.cal)}<h3>${esc(t('meetings'))}</h3>
      <span class="chip c-slate chip-sm">${ms.length}</span></div><div class="panel-b">${ms.map(meetingRow).join('')}</div></section>`:''}
    ${ps.length?`<section class="card panel"><div class="panel-h">${svg(I.folder)}<h3>${esc(t('programs'))}</h3></div>
      <div class="panel-b" style="padding:12px">${ps.map(p=>`<div style="padding:8px 10px"><b>${esc(progLabel(p))}</b>
      <div style="font-size:12px;color:var(--text-2)">${esc(p.description||'')}</div></div>`).join('')}</div></section>`:''}`;

/* ---------- 23. Main render ---------- */
const VIEWS={dashboard:viewDashboard,calendar:viewCalendar,mine:viewMine,meetings:viewMeetings,
  minutes:viewMinutes,programs:viewPrograms,activity:viewActivity,settings:viewSettings};
let lastPainted=null;
function render(){
  if(!S.user) return;
  renderNav(); renderTabbar();
  const page=$('#page');
  const key = S.query.trim() ? 'search' : S.view;
  page.innerHTML = S.query.trim()?viewSearch():(VIEWS[S.view]||viewDashboard)();
  /* Animate on navigation only — a realtime patch or a filter change
     repaints the same view and should stay still. */
  if(key!==lastPainted){
    lastPainted=key;
    page.classList.remove('enter');
    void page.offsetWidth;               // restart the animation
    page.classList.add('enter');
    clearTimeout(render._t);
    render._t=setTimeout(()=>page.classList.remove('enter'),800);
  }
  updateBell(); updateLivePill();
}
</script>
<script>
/* ---------- 24. Toast ---------- */
function toast(msg,kind=''){
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg;
  $('#toasts').appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(8px)';},2600);
  setTimeout(()=>el.remove(),3000);
}

/* ---------- 25. Drawer ---------- */
function closeDrawer(){ S.openMeetingId=null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
function openDrawer(html){
  const d=$('#drawer'); d.innerHTML=html; d.classList.add('on'); $('#scrim').classList.add('on');
  const b=d.querySelector('.dr-b'); if(b) b.scrollTop=0;
}
function historyFor(id){
  const rows=DB.activity_log.filter(a=>a.entity_id===id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

/* Rebuild an open drawer in place, keeping the reading position, so a
   live update doesn't yank the panel back to the top. */
function reopenMeetingQuietly(id){
  const body=$('#drawer .dr-b');
  const y=body?body.scrollTop:0;
  openMeeting(id);
  const b2=$('#drawer .dr-b'); if(b2) b2.scrollTop=y;
}
function updateLivePill(){
  const pill=$('#live-pill'); if(!pill) return;
  pill.classList.toggle('on', S.mode==='live' && S.rtOn);
  pill.title = t('liveOn');
  pill.querySelector('span').textContent = t('live');
}

  const conf=findConflicts({start_at:m.start_at,end_at:m.end_at,room:m.room,attendees:at.map(a=>a.user_id)},m.id);
  const hasMinutes=(m.notes||'').trim()||(m.decisions||'').trim();
  openDrawer(
   `<div class="dr-h"><div style="min-width:0"><h2>${esc(m.title)}</h2>
      <div class="sub">${chip(m.kind,'chip-sm')}${chip(m.status,'chip-sm')}
        <span>${esc(fmtDate(m.start_at))} · ${esc(fmtRange(m))}</span>
        ${m.series_id?`<span class="chip c-slate chip-sm"><span class="glyph">⟳</span>${esc(t('series'))}</span>`:''}
        ${prog?`<span class="chip c-slate chip-sm">${esc(prog)}</span>`:''}</div></div>
      <button class="icon-btn x" data-act="close-drawer" aria-label="${esc(t('close'))}">${svg(I.x)}</button></div>
    <div class="dr-b">
      ${conf.length?`<div class="callout warn" style="margin-bottom:16px">${svg(I.alert)}<span>${esc(t('conflictsFound'))}: ${
        conf.map(c=>esc(c.type==='room'
          ? t('conflictRoom').replace('{x}',c.meeting.title)
          : t('conflictPerson').replace('{p}',displayName(byId('users',c.user_id))).replace('{x}',c.meeting.title))).join(' · ')}</span></div>`:''}
      ${needsMinutes(m)?`<div class="callout warn" style="margin-bottom:16px">${svg(I.doc)}<span>${esc(t('emptyMinutes'))}</span></div>`:''}

      <div class="sec"><h4>${esc(t('description'))}</h4><div class="note">${esc(m.description||t('noneYet'))}</div></div>

      <div class="sec"><h4>${esc(t('agenda'))} (${ag.length})</h4>
        ${ag.length?`<ol class="agenda">${ag.map(a=>`<li><div class="tp">${esc(a.topic)}</div>${a.notes?`<div class="nt">${esc(a.notes)}</div>`:''}</li>`).join('')}</ol>`
        :`<p style="color:var(--text-3);font-size:13px;margin:0">${esc(t('noneYet'))}</p>`}</div>

      <div class="sec"><h4>${esc(t('attendees'))} (${at.length})</h4>
        <div class="people">${at.map(a=>`<span class="person">${avatar(a.user_id)}${esc(displayName(byId('users',a.user_id)))} ${chip(a.attendance_status,'chip-sm')}</span>`).join('')
          ||`<span style="color:var(--text-3);font-size:13px">${esc(t('noneYet'))}</span>`}</div>
        ${m.guests?`<div class="note" style="margin-top:9px"><b style="font-size:12px;color:var(--text-2)">${esc(t('guests'))}</b><br>${esc(m.guests)}</div>`:''}</div>

function saveMeeting(id){
  clearErrs();
  const f=readMeetingForm();
  let bad=false;
  if(!f.title){ showErr('e-title',t('errTitle')); bad=true; }
  if(!$('#f-start').value){ showErr('e-start',t('errStart')); bad=true; }
  if(f.start_at&&f.end_at&&new Date(f.end_at)<new Date(f.start_at)){ showErr('e-end',t('errEnd')); bad=true; }
  if(bad) return;

  /* Clashes warn, they do not block — the manager decides. */
  const conf = f.status==='scheduled' ? findConflicts(f,id) : [];
  if(conf.length && pendingSave!==JSON.stringify([f.start_at,f.end_at,f.room])){
    pendingSave=JSON.stringify([f.start_at,f.end_at,f.room]);
    $('#conflict-box').innerHTML=`<div class="callout warn">${svg(I.alert)}<span><b>${esc(t('conflictsFound'))}</b><br>${
      conf.map(c=>esc(c.type==='room'
        ? t('conflictRoom').replace('{x}',`${c.meeting.title} — ${fmtRange(c.meeting)}`)
        : t('conflictPerson').replace('{p}',displayName(byId('users',c.user_id))).replace('{x}',`${c.meeting.title} — ${fmtRange(c.meeting)}`))).join('<br>')
      }<br><br>${esc(t('saveAnyway'))} — ${esc(t('save'))}</span></div>`;
    const cb=$('#conflict-box'); if(cb.scrollIntoView) cb.scrollIntoView({block:'nearest'});
    return;
  }
  pendingSave=null;

  const {attendees,...patch}=f;
  let created=[];
  if(id){
    const old=byId('meetings',id);
    Store.update('meetings',id,patch);
    if(old.start_at!==patch.start_at||old.end_at!==patch.end_at) logAct(id,'time_changed',`${fmtDT(old.start_at)} → ${fmtDT(patch.start_at)}`);
    if(old.status!==patch.status) logAct(id,'status_changed',`${t(old.status)} → ${t(patch.status)}`);
    logAct(id,'edited','');
    created=[byId('meetings',id)];
  } else {
    const rep=$('#f-rep')?$('#f-rep').value:'none_';
    const n = rep==='none_' ? 1 : Math.min(24,Math.max(2,Number($('#f-repn').value)||2));
    const series = rep==='none_' ? null : 'sr-'+uid();
    const stepDays = {weekly:7,biweekly:14}[rep];
    for(let i=0;i<n;i++){
      const shift = d => { if(!d) return null; const x=new Date(d);
        if(rep==='monthly') x.setMonth(x.getMonth()+i); else if(stepDays) x.setDate(x.getDate()+stepDays*i); return x.toISOString(); };
      const row=Store.insert('meetings',{...patch,start_at:shift(patch.start_at),end_at:shift(patch.end_at),
        notes:'',decisions:'',series_id:series,created_by:S.user.id});
      logAct(row.id,'created',row.title);
      created.push(row);
    }
  }
  /* agenda + attendees are rewritten on the primary record; copies share the agenda */
  created.forEach((row,idx)=>{
    agendaOf(row.id).forEach(a=>Store.remove('agenda_items',a.id));
    $$('#ag-rows .rep-row').forEach((r,i)=>{
      const topic=r.querySelector('.ag-topic').value.trim(); if(!topic) return;
      Store.insert('agenda_items',{meeting_id:row.id,topic,sort_order:i+1,notes:r.querySelector('.ag-notes').value.trim()});
    });
    attendeesOf(row.id).forEach(a=>{ if(!attendees.includes(a.user_id)) Store.remove('meeting_attendees',a.id); });
    attendees.forEach(u=>{ if(!isAttendee(row.id,u)) Store.insert('meeting_attendees',{meeting_id:row.id,user_id:u,attendance_status:'invited'}); });
  });
  closeModal(); render(); toast(t('savedOk'));
  openMeeting(created[0].id);
}

function deleteMeeting(id,series){
  const m=byId('meetings',id);
  const targets = series && m.series_id ? DB.meetings.filter(x=>x.series_id===m.series_id) : [m];
  targets.forEach(x=>{
    agendaOf(x.id).forEach(a=>Store.remove('agenda_items',a.id));
    attendeesOf(x.id).forEach(a=>Store.remove('meeting_attendees',a.id));

/* ---------- 31. Notifications ---------- */
function buildNotifications(){
  const out=[], now=new Date(), pr=S.prefs;
  DB.meetings.forEach(m=>{
    const involved = isAttendee(m.id,S.user.id) || m.created_by===S.user.id || canManage();
    if(!involved) return;
    if(pr.reminder && m.status==='scheduled'){
      const hrs=(new Date(m.start_at)-now)/3600000;
      if(hrs>0&&hrs<=1) out.push({id:`m:${m.id}:1h`,cls:'c-orange',icon:I.clock,title:m.title,desc:t('nNow'),when:m.start_at,go:m.id,rank:0});
      else if(hrs>1&&hrs<=24) out.push({id:`m:${m.id}:24h`,cls:'c-blue',icon:I.cal,title:m.title,desc:t('nSoon'),when:m.start_at,go:m.id,rank:2});
    }
    if(pr.minutesAlert && needsMinutes(m))
      out.push({id:`m:${m.id}:min`,cls:'c-gold',icon:I.doc,title:m.title,desc:t('nNeedMinutes')+' · '+relative(m.start_at),when:m.start_at,go:m.id,rank:1});
  });
  if(pr.changes){
    DB.activity_log.filter(a=>a.action==='time_changed' && (new Date()-new Date(a.created_at))<7*MS_DAY)
      .forEach(a=>{ const m=byId('meetings',a.entity_id); if(!m) return;
        if(!(isAttendee(m.id,S.user.id)||canManage())) return;
        out.push({id:`m:${m.id}:chg:${a.id}`,cls:'c-slate',icon:I.repeat,title:m.title,desc:t('nChanged')+' · '+a.details,when:a.created_at,go:m.id,rank:3}); });
  }
  out.sort((a,b)=>a.rank-b.rank||new Date(a.when)-new Date(b.when));
  return out;
}

/* ---------- 32b. Connection check ----------
   Tests the URL and key directly with fetch, so it works even when the
   Supabase library itself failed to load. Each check names one cause. */
async function runDiagnostics(url,key){
  const rows=[];
  const add=(k,ok,msg,extra)=>rows.push({k,ok,msg,extra});

  let valid=false;
  try{ const u=new URL(url); valid = /^https?:$/.test(u.protocol) && !!u.hostname; }catch(e){}
  add('cUrl', valid, valid?t('cOkUrl'):t('cBadUrl'), valid?url:'');
  if(!valid) return rows;

  const head={apikey:key, Authorization:'Bearer '+key};
  let reached=false;
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/health',{headers:{apikey:key}});
    reached=true;
    add('cReach', true, t('cOkReach'), 'HTTP '+r.status);
  }catch(e){
    add('cReach', false, t('cBadReach'), e.message||'network error');
    return rows;
  }

  let status=0, body='';
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/rest/v1/users?select=id&limit=1',{headers:head});
    status=r.status; body=await r.text();
  }catch(e){ add('cKey', false, t('cBadKey'), e.message); return rows; }

  if(status===401||status===403) add('cKey', false, t('cBadKey'), 'HTTP '+status);
  else add('cKey', true, t('cOkKey'), 'HTTP '+status);

  if(status===404) add('cTables', false, t('cBadTables'), 'HTTP 404');
  else if(status<400) add('cTables', true, t('cOkTables'), '');
  else if(status!==401&&status!==403) add('cTables', false, t('cBadTables'), (body||'').slice(0,120));

  add('cLib', !!window.supabase, window.supabase?t('cOkLib'):t('cBadLib'), S.errDetail||'');
  return rows;
}

           worth naming, so the two are not confused. */

        return loginError(bad?t('badLogin'):t('authErr'), bad?'':error.message);

/* Service worker: only over http(s). Opening the file directly still
   works, it simply cannot install or cache. */
async function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    /* The worker is registered at this point; anything below is only the
       update prompt, so it must never be able to undo that. */
    if(!reg || typeof reg.addEventListener!=='function') return;
    reg.addEventListener('updatefound',()=>{
      const sw=reg.installing; if(!sw) return;
      sw.addEventListener('statechange',()=>{
        if(sw.state==='installed'&&navigator.serviceWorker.controller){
          const el=document.createElement('div');
          el.className='toast warn';
          el.innerHTML=`${esc(t('updateReady'))} — <button style="background:none;border:0;font:inherit;font-weight:800;color:var(--green);text-decoration:underline;padding:0">${esc(t('reload'))}</button>`;
          el.querySelector('button').addEventListener('click',()=>{ sw.postMessage('skip-waiting'); location.reload(); });
          $('#toasts').appendChild(el);
        }
      });
    });
  }catch(e){ console.warn('Service worker not registered:', e.message); }
}

/* ---------- 34b. Install readiness ----------
   Edge and Chrome only offer installation when every one of these holds.
   Checking them individually says which one is missing. */
async function runInstallChecks(){
  const rows=[];
  const add=(k,ok,msg,extra)=>rows.push({k,ok,msg,extra});

  const secure = location.protocol==='https:' || location.hostname==='localhost';
  add('iHttps', secure, secure?t('iOkHttps'):t('iBadHttps'), location.origin);
  if(!secure) return rows;

  const link=document.querySelector('link[rel="manifest"]');
  const href=link?link.href:'';
  let mf=null;
  try{
    const r=await fetch(href,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    mf=await r.json();
    add('iManifest', true, t('iOkManifest'), href);
  }catch(e){
    add('iManifest', false, t('iBadManifest'), (href||'no <link rel=manifest>')+' — '+(e.message||e));
    return rows;
  }

  const sizes=(mf.icons||[]).map(i=>String(i.sizes||''));
  const has192=sizes.some(z=>/(^|\s)192x192/.test(z));
  const has512=sizes.some(z=>/(^|\s)512x512/.test(z));
  let reachable=true, missing='';
  for(const ic of (mf.icons||[])){
    try{
      const u=new URL(ic.src, href);
      const r=await fetch(u,{method:'GET',cache:'no-store'});
      if(!r.ok){ reachable=false; missing+=(missing?', ':'')+ic.src+' ('+r.status+')'; }
    }catch(e){ reachable=false; missing+=(missing?', ':'')+ic.src; }
  }
  const iconsOk = has192 && has512 && reachable;
  add('iIcons', iconsOk, iconsOk?t('iOkIcons'):t('iBadIcons'),
      missing || (has192&&has512 ? '' : 'declared: '+sizes.join(', ')));

  let sw=null;
  try{ if('serviceWorker' in navigator) sw = await navigator.serviceWorker.getRegistration(); }catch(e){}
  add('iSw', !!sw, sw?t('iOkSw'):t('iBadSw'), sw?(sw.active?'active':'installing'):new URL('./sw.js',location.href).href);

  detectStandalone();
  if(S.installed) add('iPrompt', true, t('iInstalled'), '');
  else add('iPrompt', S.canInstall, S.canInstall?t('iOkPrompt'):t('iWaitPrompt'), '');
  return rows;
}

async function openInstallCheck(){
  const line=r=>`<div style="display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)">
      <span class="chip ${r.ok?'c-green':'c-red'} chip-sm" style="min-width:88px;justify-content:center">
        <span class="glyph">${r.ok?'✓':'✕'}</span>${esc(t(r.k))}</span>
      <span style="flex:1;font-size:13px"><b style="font-weight:700">${esc(r.msg)}</b>
      ${r.extra?`<br><small style="color:var(--text-3);word-break:break-all">${esc(r.extra)}</small>`:''}</span></div>`;
  modal(t('installCheck'), `<p style="margin:0;color:var(--text-2);font-size:13px">${esc(t('running'))}</p>`,
    `<button class="btn ghost" data-act="close-modal">${esc(t('close'))}</button>`, true);
  const rows=await runInstallChecks();
  const body=$('#modal-host .mb');
  if(body) body.innerHTML=`<div>${rows.map(line).join('')}</div>`;
}

/* ---------- 35. Boot ---------- */
(async function boot(){
  setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  await Store.init();
  setLang('ar');
  paintLogin();
  detectStandalone();
  refreshNetPill();
  /* Already signed in on this device? Go straight through, keeping the
     splash up so the login form never appears in between. */
  if(S.mode==='live'&&S.sb){
    try{
      const {data}=await S.sb.auth.getSession();
      if(data&&data.session&&data.session.user) await afterAuth(data.session.user);
    }catch(e){ console.warn('Could not restore session:', e.message); }
  }
  if(!S.user) revealLogin(); else hideBoot();
  updateLivePill();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') RT.resync(); });
  window.addEventListener('online',()=>{ RT.start(); RT.resync(); });
  registerSW();
  setTimeout(()=>{ if(!S.user) revealLogin(); },9000);   // safety net
  setInterval(()=>{ if(S.user) updateBell(); },60000);
  window.MDM={DB,S,Local,RT,CONN,diagnose:runDiagnostics,installChecks:runInstallChecks,looksAutoNamed,byId,canManage,canEditMeeting,needsMinutes,findConflicts,render,Store,buildNotifications,attendeesOf,agendaOf,followUpsOf};
})();
</script>
